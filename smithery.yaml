# Smithery configuration for webPosto
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_webposto

name: webposto-mcp
displayName: "webPosto"
description: >
  ERP webPosto (gestão de postos de combustível e lojas de conveniência) por captura de sessão com a sua autorização. Como o webPosto não tem API pública, você informa o CNPJ, usuário e senha da sua conta e a plataforma entra no seu webPosto para ler os seus próprios dados, na mesma API que o app oficial usa. Somente leitura.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/webposto-mcp
repository: https://github.com/mcp-dir/webposto-mcp

tags:
  - webposto
  - brazil
  - fin
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_webposto

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_webposto/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
